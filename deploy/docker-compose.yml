name: challengemon

services:
  db:
    mem_limit: 512m
    image: public.ecr.aws/docker/library/postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_connections=100", "-c", "shared_buffers=128MB"]
    environment:
      POSTGRES_DB: challengemon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "challengemon"]
      interval: 5s
      retries: 20

  auth:
    mem_limit: 128m
    image: public.ecr.aws/supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: https://${SITE_DOMAIN}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/challengemon?search_path=auth
      GOTRUE_SITE_URL: https://${SITE_DOMAIN}
      GOTRUE_URI_ALLOW_LIST: https://${SITE_DOMAIN}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM}
      GOTRUE_SMTP_SENDER_NAME: Challengemon
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Bestätige deine E-Mail für Challengemon
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Passwort für Challengemon zurücksetzen
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 30

  rest:
    mem_limit: 128m
    image: public.ecr.aws/supabase/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/challengemon
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  realtime:
    mem_limit: 512m
    image: public.ecr.aws/supabase/realtime:v2.34.47
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: challengemon
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  app:
    mem_limit: 384m
    build:
      context: ..
      args:
        NEXT_PUBLIC_SUPABASE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
        NEXT_PUBLIC_OPERATOR_NAME: ${OPERATOR_NAME:-}
        NEXT_PUBLIC_OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
        NEXT_PUBLIC_HOSTING_NOTE: ${HOSTING_NOTE:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://${SITE_DOMAIN}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET}
      CLOUD_DIR: /data/cloud
      CLOUD_ROM_SLOTS: ${CLOUD_ROM_SLOTS:-1}
      CLOUD_DATA_MAX_MB: ${CLOUD_DATA_MAX_MB:-256}
    volumes:
      - cloud:/data/cloud

  caddy:
    mem_limit: 64m
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    depends_on: [auth, rest, realtime, app]
    ports:
      - "127.0.0.1:${PROXY_PORT:-8090}:8090"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  db:
  cloud:
